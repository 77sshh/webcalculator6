version: '3.8'

services:
  mariadb:
    container_name: web-mariadb-6
    hostname: mariadb
    image: mariadb:10.5
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: webcalculatordb6
      MARIADB_USER: root
      MARIADB_PASSWORD: password
    ports:
      - "5077:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app-network

  web:
    container_name: 6_calculator-web
    build: .
    ports:
      - "5006:5006"
    depends_on:
      - mariadb
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - app-network

volumes:
  mariadb_data:

networks:
  app-network:
    driver: bridge