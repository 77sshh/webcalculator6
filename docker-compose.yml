version: '3.8'

services:
  mariadb:
    container_name: web-mariadb-6
    hostname: mariadb
    image: mariadb:10.5
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: webcalculatordb6
      MARIADB_USER: root
      MARIADB_PASSWORD: password
    ports:
      - "5077:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app-network
      - metrics-net  

  web:
    container_name: 6_calculator-web
    build: .
    ports:
      - "5006:5006"
    depends_on:
      - mariadb
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - app-network
      - metrics-net  

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    user: root
    volumes:
      - ./prometheus/config/:/etc/prometheus/  
      - ./prometheus/data:/prometheus:rw
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - metrics-net
    restart: unless-stopped

volumes:
  mariadb_data:

networks:
  app-network:
    name: app-network
  metrics-net:
    name: metrics-net
